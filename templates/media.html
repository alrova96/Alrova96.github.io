{% extends "base.html" %}

{% block title %}Media - {{ site.title }}{% endblock %}

{% block content %}
<!-- Page Header -->
<section style="position: relative; height: 260px; overflow: hidden;">
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)), url('static/img/fondo_media.png'); background-size: cover; background-position: center center;"></div>
    <div class="container" style="position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
        <h1 style="color: white; font-size: 3.5rem; margin-bottom: 1rem; text-shadow: 2px 2px 8px rgba(0,0,0,0.7);">Media</h1>
        <p style="color: var(--color-light-beige); font-size: 1.4rem; max-width: 800px; text-shadow: 1px 1px 4px rgba(0,0,0,0.7);">Press coverage and media appearances</p>
    </div>
</section>

<!-- Media Grid -->
<section class="media-section">
    <div class="container">
        <div class="media-filter-bar">
            <button class="media-filter-btn active" data-filter="all">All</button>
            <button class="media-filter-btn" data-filter="TV">TV</button>
            <button class="media-filter-btn" data-filter="Radio">Radio</button>
            <button class="media-filter-btn" data-filter="Press">Press</button>
            <button class="media-filter-btn" data-filter="Video">Video</button>
            <button class="media-filter-btn" data-filter="Article">Article</button>
            <button class="media-filter-btn" data-filter="Podcast">Podcast</button>
            <button class="media-filter-btn" data-filter="Interview">Interview</button>
        </div>

        <div class="media-grid-v2">
            {% for item in media_items %}
            <a href="{{ item.url }}" target="_blank" class="media-card-v2" data-category="{{ item.category }}">
                <img src="static/img/{{ item.image }}" alt="{{ item.title }}">
                <div class="media-card-v2__overlay">
                    <h3>{{ item.title }}</h3>
                    <span class="media-card-v2__cat">{{ item.category }}</span>
                    <span class="media-card-v2__date">{{ item.date }}</span>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</section>

<script>
    document.querySelectorAll('.media-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const filter = btn.dataset.filter;
            document.querySelectorAll('.media-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.media-card-v2').forEach(card => {
                card.style.display = (filter === 'all' || card.dataset.category === filter) ? '' : 'none';
            });
        });
    });
</script>
{% endblock %}
