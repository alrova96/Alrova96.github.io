{% extends "base.html" %}

{% block title %}Team - {{ site.title }}{% endblock %}

{% block content %}
<!-- Page Header -->
<section style="position: relative; height: 260px; overflow: hidden;">
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)), url('static/img/fondo.png'); background-size: cover; background-position: center center;"></div>
    <div class="container" style="position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
        <h1 style="color: white; font-size: 3.5rem; margin-bottom: 1rem; text-shadow: 2px 2px 8px rgba(0,0,0,0.7);">Our Team</h1>
        <p style="color: var(--color-light-beige); font-size: 1.4rem; max-width: 800px; text-shadow: 1px 1px 4px rgba(0,0,0,0.7);">
            Meet the people behind the research
        </p>
    </div>
</section>

<!-- Coming Soon Section -->
<section style="background-color: var(--color-light-beige); min-height: 60vh; display: flex; align-items: center; justify-content: center;">
    <div class="container" style="text-align: center;">
        <div style="max-width: 600px; margin: 0 auto;">
            <i class="fas fa-users" style="font-size: 6rem; color: var(--color-medium-beige); margin-bottom: 2rem;"></i>
            <h2 style="color: var(--color-navy); margin-bottom: 1.5rem; font-size: 2.5rem;">Coming Soon</h2>
            <p style="color: var(--color-brown); font-size: 1.2rem; line-height: 1.8;">
                We're working on introducing our amazing team members. Stay tuned for updates!
            </p>
        </div>
    </div>
</section>
{% endblock %}
